<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tornare a me — versione da stampare</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#2E2420;--cream:#FAF6F0;--sand:#EFE4D9;--line:#CDB9A6;--terra:#A8703F;--muted:#7A6A60;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#E9E1D8;color:var(--ink);font-family:var(--sans);font-size:11.5pt;line-height:1.5}
.bar{position:sticky;top:0;z-index:2;background:#1F1612;color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar a{color:#E6C894;text-decoration:none;font-size:14px}
.bar button{border:0;border-radius:99px;padding:12px 22px;font:600 15px var(--sans);background:linear-gradient(135deg,#D9B77E,#B98B4E);color:#1F1612;cursor:pointer}
.bar small{display:block;color:#C9B8A6;font-size:12px}
.page{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:18px auto;padding:20mm 18mm 16mm;position:relative;break-after:page;page-break-after:always;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.page:last-child{break-after:auto;page-break-after:auto}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
h1{font-size:30pt}h2{font-size:15pt;margin-top:16pt}
.eyebrow{font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-weight:600}
.sub{font-family:var(--serif);font-style:italic;color:var(--terra);font-size:15pt;margin:6pt 0 10pt;line-height:1.25}
.muted{color:var(--muted)}.small{font-size:9.5pt}
p{margin:0 0 8pt}
.q{font-weight:500;margin:11pt 0 0}
.lines i{display:block;height:8.2mm;border-bottom:1px solid var(--line)}
.box{border:1px solid var(--line);border-radius:3mm;overflow:hidden;margin-top:9pt}
.box>b{display:block;background:var(--sand);padding:5pt 9pt;font:italic 500 12.5pt var(--serif);color:var(--ink)}
.box .lines{padding:0 9pt 5pt}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8pt;margin:8pt 0 2pt}
.meters div{border:1px solid var(--line);border-radius:3mm;padding:6pt 8pt;text-align:center;font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.meters span{display:flex;justify-content:center;gap:5pt;margin-top:5pt}
.meters span i{width:6mm;height:6mm;border:1px solid var(--terra);border-radius:50%;font-style:normal;font-weight:400;font-size:8pt;line-height:6mm;color:var(--muted);letter-spacing:0}
.rem{background:var(--sand);border-left:2.5pt solid var(--terra);border-radius:2mm;padding:8pt 11pt;margin-top:12pt}
.rem b{font-size:8pt;letter-spacing:.18em;color:var(--terra);display:block}
.rem span{font-family:var(--serif);font-size:14pt;line-height:1.25}
.step{border:1px dashed var(--terra);border-radius:3mm;padding:8pt 11pt;margin-top:12pt}
.step b{font-size:8pt;letter-spacing:.18em;color:var(--terra);display:block;margin-bottom:2pt}
.foot{position:absolute;left:0;right:0;bottom:8mm;text-align:center;font-size:7.5pt;letter-spacing:.18em;color:#A8998C;text-transform:uppercase}
.cover{background:linear-gradient(180deg,rgba(31,22,18,.35),rgba(31,22,18,.85)),url(img/cover.jpg) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover h1{font-size:50pt;letter-spacing:.03em;margin:10pt 0}.cover .eyebrow{color:#E6C894}.cover .sub{color:#E6C894;font-size:19pt}
.list10{columns:2;column-gap:10mm;margin-top:6pt}.list10 div{display:flex;gap:6pt;align-items:flex-end;height:9mm;break-inside:avoid}.list10 i{flex:1;border-bottom:1px solid var(--line)}
.check{display:flex;gap:9pt;align-items:center;margin:10pt 0;font-family:var(--serif);font-size:15pt}.check i{width:5mm;height:5mm;border:1px solid var(--terra);border-radius:1mm;flex:none}
.lock{max-width:460px;margin:80px auto;background:#fff;border-radius:20px;padding:30px 24px;text-align:center}
.lock input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;margin:14px 0 10px;text-align:center}
.lock button{border:0;border-radius:99px;padding:14px 26px;font:600 16px var(--sans);background:#1F1612;color:#fff;cursor:pointer}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;overflow:hidden}}
@media screen and (max-width:820px){.page{padding:26px 20px 50px;min-height:0}.cover{min-height:70vh}.list10{columns:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="days.js"></script>
<script>
(function(){
var C=window.TAM,DAYS=window.TAM_DAYS,root=document.getElementById('root'),S={};
try{S=JSON.parse(localStorage.getItem('tam_v1'))||{}}catch(e){}
function lines(n){return '<div class="lines">'+Array(n+1).join('<i></i>')+'</div>'}
function box(label,n){return '<div class="box"><b>'+label+'</b>'+lines(n)+'</div>'}
function foot(){return '<div class="foot">Project Liberty · Tornare a me</div>'}
function meter(l){return '<div>'+l+'<span><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i></span></div>'}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}
function unlock(code){code=String(code||'').trim().toUpperCase();if(!code||!window.crypto||!crypto.subtle)return Promise.resolve(false);
  return sha(code).then(function(h){if(h!==C.accessHash)return false;S.paid=true;if(!S.days)S.days={};try{localStorage.setItem('tam_v1',JSON.stringify(S))}catch(e){}return true})}

function locked(){
  root.innerHTML='<div class="lock"><div class="eyebrow">Tornare a me</div><h1 style="font-size:30px;margin:10px 0">La versione da stampare</h1><p class="muted">È inclusa nel percorso completo. Inserisci il codice ricevuto dopo l\'acquisto.</p><input id="k" placeholder="CODICE" autocapitalize="characters"><p id="e" style="color:#A33;min-height:20px;font-size:14px"></p><button id="ok">Sblocca</button><p style="margin-top:18px"><a href="index.html" style="color:var(--terra)">Scopri il percorso</a></p></div>';
  document.getElementById('ok').onclick=function(){unlock(document.getElementById('k').value).then(function(ok){ok?render():document.getElementById('e').textContent='Codice non valido.'})};
}

function render(){
  var h='<div class="bar"><div><a href="app.html">← Torna al percorso</a><small>Formato A4 · 28 pagine · da compilare a penna</small></div><button id="pr">Stampa / salva in PDF</button></div>';
  h+='<section class="page cover"><div class="eyebrow">Project Liberty</div><h1>TORNARE A ME</h1><div class="sub">14 giorni per ricominciare a scegliermi</div><p>Un piccolo spazio per te. Dieci minuti al giorno.</p><p style="margin-top:40pt;font-family:var(--serif);font-style:italic;font-size:15pt">di Viola</p></section>';
  h+='<section class="page"><div class="eyebrow">Come usarlo</div><h1>Prima di cominciare</h1><div class="sub">Non devi risolvere tutto. Ogni giorno apre soltanto una porta.</div><p>Dedica circa dieci minuti al giorno a queste pagine. Ti serviranno un posto tranquillo, una penna e un po\' di sincerità con te stessa. Non cercare risposte perfette: scrivi quello che senti, anche se è confuso.</p><p class="small muted">Questo percorso è uno spazio di riflessione personale e non sostituisce un supporto medico, psicologico o terapeutico. Se una situazione o una relazione ti fa sentire in pericolo, la priorità è chiedere aiuto: in Italia 1522, in Svizzera 143, per le emergenze 112.</p><h2>Oggi, prima di iniziare</h2><p class="muted small">Non è un test. È una piccola fotografia del momento in cui stai cominciando.</p>'+box('Tre parole che descrivono come mi sento oggi',2)+box('In questo momento ho bisogno di',3)+box('Da questi quattordici giorni vorrei portare con me',3)+foot()+'</section>';
  DAYS.forEach(function(d){
    var x=d.extra,ex='';
    if(x){ex='<div class="eyebrow">Giorno '+d.n+' · esercizio</div><h1>'+x.title+'</h1><p class="muted" style="margin-top:8pt">'+x.note+'</p>';
      if(x.compact){ex+='<div class="list10">';for(var k=0;k<x.compact;k++)ex+='<div><span>'+(k+1)+'.</span><i></i></div>';ex+='</div>'+box(x.fields[x.compact],3)}
      else if(x.long)ex+=lines(16);
      else x.fields.forEach(function(f){ex+=box(f,x.fields.length>4?2:3)})}
    var closing='<div class="step"><b>IL PICCOLO PASSO DI OGGI</b>'+d.step+'</div><div class="rem"><b>DA RICORDARE</b><span>'+d.remember+'</span></div>';
    h+='<section class="page"><div class="eyebrow">Giorno '+d.n+' di 14</div><h1>'+d.title+'</h1><div class="sub">'+d.sub+'</div><p>'+d.intro+'</p>'+
      '<div class="meters">'+meter('Energia')+meter('Spazio per me')+meter('Chiarezza')+'</div>'+
      d.q.map(function(q,k){return '<p class="q">'+(k+1)+'. '+q+'</p>'+lines(x?4:3)}).join('')+
      box(d.prompt,x?3:2)+(x?'':closing)+foot()+'</section>';
    if(x)h+='<section class="page">'+ex+closing+foot()+'</section>';
  });
  h+='<section class="page"><div class="eyebrow">Un impegno gentile</div><h1>La mia promessa</h1><div class="sub">Da oggi voglio provare a</div>'+lines(5)+box('La cosa che voglio proteggere',2)+box('Il piccolo gesto che ripeterò',2)+box('Quando mi dimenticherò di me, proverò a',2)+'<p style="margin-top:22pt">Firma: ______________________________ &nbsp; Data: ____________________</p>'+foot()+'</section>';
  h+='<section class="page"><div class="eyebrow">Il mio promemoria</div><h1>Quando tornerò a mettere tutto e tutti davanti a me</h1><div style="margin-top:14pt">'+window.TAM_REMINDERS.map(function(r){return '<div class="check"><i></i>'+r+'</div>'}).join('')+'</div><div class="sub" style="text-align:center;margin-top:22pt">Non è troppo tardi per tornare a me.</div>'+foot()+'</section>';
  h+='<section class="page"><div class="eyebrow">Una lettera per te</div><h1 style="margin-bottom:14pt">Una lettera per te</h1>'+window.TAM_LETTER.map(function(p,i,a){return '<p'+(i===a.length-1?' style="font-weight:600"':'')+'>'+p+'</p>'}).join('')+'<div class="sub" style="margin-top:16pt">Viola</div><p class="small muted">@'+C.igHandle+'</p>'+foot()+'</section>';
  root.innerHTML=h;
  document.getElementById('pr').onclick=function(){window.print()};
}

var k=new URLSearchParams(location.search).get('k');
if(k){history.replaceState(null,'',location.pathname);unlock(k).then(function(){S.paid?render():locked()})}
else S.paid?render():locked();
})();
</script>
</body>
</html>
